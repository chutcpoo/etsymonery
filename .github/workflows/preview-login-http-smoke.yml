name: Preview Login HTTP Smoke

on:
  push:
    branches:
      - feature/mosselorastudio-dna-runtime-v1-1

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test public login, session and protected navigation without secrets
        shell: bash
        env:
          BASE: https://autodigitalpublisher-git-feature-mos-1b1d4d-shopee-affiliate-ai.vercel.app
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$headers" "$body"' EXIT
          ready=0
          for _ in $(seq 1 45); do
            code=$(curl -sS --max-time 15 -H 'Accept: text/html' -D "$headers" -o "$body" -w '%{http_code}' "$BASE/login" || true)
            if [ "$code" = "200" ] && grep -qiE '<html|<!DOCTYPE html' "$body" && grep -qi 'Mosselora' "$body"; then
              ready=1
              break
            fi
            sleep 6
          done
          echo "GET /login: HTTP $code"
          if [ "$ready" -ne 1 ]; then
            echo "Expected branded login HTML; last body (up to 120 chars):"
            head -c 120 "$body" | tr '\n' ' '
            exit 1
          fi
          code=$(curl -sS --max-time 15 -H 'Accept: application/json' -D "$headers" -o "$body" -w '%{http_code}' "$BASE/api/auth/session")
          echo "GET /api/auth/session: HTTP $code"
          test "$code" = "200"
          grep -q '"authenticated":false' "$body"
          code=$(curl -sS --max-time 15 -H 'Accept: text/html' -D "$headers" -o "$body" -w '%{http_code}' "$BASE/factory")
          echo "GET /factory (no cookie): HTTP $code"
          test "$code" = "307"
          grep -qiE '^location: .*/login\?next=' "$headers"
          if grep -qi '^www-authenticate:' "$headers"; then echo "Browser Basic challenge must not occur"; exit 1; fi
          code=$(curl -sS --max-time 15 -H 'Accept: application/json' -D "$headers" -o "$body" -w '%{http_code}' "$BASE/api/etsy/status")
          echo "GET /api/etsy/status (no cookie): HTTP $code"
          test "$code" = "401"
          if grep -qi '^www-authenticate:' "$headers"; then echo "Browser Basic challenge must not occur"; exit 1; fi
