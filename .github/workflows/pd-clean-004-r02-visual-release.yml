name: PD-CLEAN-004 R02 Visual Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: verify_protected_state or execute
        required: true
        default: verify_protected_state
        type: choice
        options:
          - verify_protected_state
          - execute
      confirmation:
        description: Re-type exact operation ID PD-CLEAN-004-VISUAL-R02-RELEASE-001
        required: true
        type: string
      protected_state_fingerprint:
        description: Fresh protected-state SHA-256; required only for execute
        required: false
        default: ""
        type: string
      authorization_request_hash:
        description: Exact authorization binding SHA-256; required only for execute
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pd-clean-004-r02-visual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ENDPOINT: https://autodigitalpublisher.vercel.app/api/internal/etsy/pd-clean-004/r02/visual-release
      OPERATION_ID: PD-CLEAN-004-VISUAL-R02-RELEASE-001
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PROTECTED_STATE_FINGERPRINT: ${{ inputs.protected_state_fingerprint }}
      AUTHORIZATION_REQUEST_HASH: ${{ inputs.authorization_request_hash }}
    steps:
      - name: Fail closed on exact request
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "$OPERATION_ID" || { echo "Operation confirmation mismatch"; exit 1; }
          case "$ACTION" in
            verify_protected_state) ;;
            execute)
              echo "$PROTECTED_STATE_FINGERPRINT" | grep -Eq '^[a-f0-9]{64}$' || { echo "Invalid protected_state_fingerprint"; exit 1; }
              echo "$AUTHORIZATION_REQUEST_HASH" | grep -Eq '^[a-f0-9]{64}$' || { echo "Invalid authorization_request_hash"; exit 1; }
              ;;
            *) echo "Invalid action"; exit 1 ;;
          esac

      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENDPOINT}")"
          TOKEN="$(node -e 'const v=JSON.parse(process.argv[1]).value; if(!v) process.exit(1); process.stdout.write(v)' "$RESPONSE")"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify or execute exact PD-CLEAN-004 R02 operation
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(process.env.ENDPOINT, {
            method: "POST",
            headers: {
              authorization: `Bearer ${process.env.OIDC_TOKEN}`,
              "content-type": "application/json"
            },
            body: JSON.stringify({
              operationId: process.env.OPERATION_ID,
              confirmation: process.env.CONFIRMATION,
              action: process.env.ACTION,
              protectedStateFingerprint: process.env.PROTECTED_STATE_FINGERPRINT || undefined,
              authorizationRequestHash: process.env.AUTHORIZATION_REQUEST_HASH || undefined
            })
          });
          const text = await response.text();
          let payload;
          try { payload = text ? JSON.parse(text) : {}; }
          catch { payload = { raw: text }; }
          console.log(`HTTP ${response.status}`);
          console.log(JSON.stringify(payload, null, 2));

          if (process.env.ACTION === "verify_protected_state") {
            if (!response.ok || payload.status !== "PROTECTED_STATE_MATCH" || payload.ETSY_WRITE_COUNT !== 0) {
              throw new Error(`PD_CLEAN_R02_PROTECTED_STATE_HTTP_${response.status}`);
            }
            process.exit(0);
          }

          if (response.status === 202) throw new Error("PD_CLEAN_R02_RECONCILIATION_REQUIRED_DO_NOT_RETRY");
          if (!response.ok) throw new Error(`PD_CLEAN_R02_EXECUTE_HTTP_${response.status}`);
          const acceptable = new Set(["UPDATED_AND_VERIFIED", "REPLAY"]);
          if (!acceptable.has(payload.status)) throw new Error(`PD_CLEAN_R02_NONTERMINAL_${payload.status ?? "UNKNOWN"}`);
          NODE
