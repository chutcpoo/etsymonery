name: Execute Authorized Etsy Operation

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Exact authorized operationId
        required: true
        type: string
      confirmation:
        description: Re-type the exact authorized operationId
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: authorized-etsy-operation-${{ inputs.operation_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXECUTION_URL: https://autodigitalpublisher.vercel.app/api/internal/etsy/authorized-operation
      OIDC_AUDIENCE: https://autodigitalpublisher.vercel.app/api/internal/etsy/authorized-operation
      OPERATION_ID: ${{ inputs.operation_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Fail closed on confirmation mismatch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATION_ID" || { echo "Missing operation_id"; exit 1; }
          test "$OPERATION_ID" = "$CONFIRMATION" || { echo "Operation confirmation mismatch"; exit 1; }

      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub OIDC request URL unavailable"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "GitHub OIDC request token unavailable"; exit 1; }
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          TOKEN="$(node -e 'const v=JSON.parse(process.argv[1]).value; if(!v) process.exit(1); process.stdout.write(v)' "$RESPONSE")"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Execute exact authorized operation once
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(process.env.EXECUTION_URL, {
            method: "POST",
            headers: {
              "authorization": `Bearer ${process.env.OIDC_TOKEN}`,
              "content-type": "application/json"
            },
            body: JSON.stringify({
              operationId: process.env.OPERATION_ID,
              confirmation: process.env.CONFIRMATION
            })
          });

          const text = await response.text();
          let payload;
          try { payload = text ? JSON.parse(text) : {}; }
          catch { payload = { raw: text }; }

          console.log(`HTTP ${response.status}`);
          console.log(JSON.stringify(payload, null, 2));

          if (response.status === 202) {
            throw new Error("RECONCILIATION_REQUIRED_DO_NOT_RETRY");
          }
          if (!response.ok) {
            throw new Error(`AUTHORIZED_ETSY_HTTP_${response.status}`);
          }

          const acceptable = new Set(["UPDATED_AND_VERIFIED", "RECONCILED", "REPLAY"]);
          if (!acceptable.has(payload.status)) {
            throw new Error(`AUTHORIZED_ETSY_NONTERMINAL_${payload.status ?? "UNKNOWN"}`);
          }
          NODE
