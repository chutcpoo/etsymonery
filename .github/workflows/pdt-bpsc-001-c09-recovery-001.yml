name: PDT BPSC 001 C09 Recovery 001

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Re-type PDT-BPSC-001-C09-RECOVERY-001
        required: true
        type: string
      action:
        description: verify_protected_state or execute
        required: true
        default: verify_protected_state
        type: string
      authorization_id:
        description: Fresh exact recovery authorization ID; execute only
        required: false
        default: ""
        type: string
      protected_state_fingerprint:
        description: Fresh recovery protected-state SHA-256; execute only
        required: false
        default: ""
        type: string
      authorization_request_hash:
        description: Exact recovery authorization request SHA-256; execute only
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pdt-bpsc-001-c09-recovery-001
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXECUTION_URL: https://autodigitalpublisher.vercel.app/api/internal/etsy/pdt-bpsc-001/c09/recovery-001
      OPERATION_ID: PDT-BPSC-001-C09-RECOVERY-001
      CONFIRMATION: ${{ inputs.confirmation }}
      ACTION: ${{ inputs.action }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
      PROTECTED_STATE_FINGERPRINT: ${{ inputs.protected_state_fingerprint }}
      AUTHORIZATION_REQUEST_HASH: ${{ inputs.authorization_request_hash }}
    steps:
      - name: Fail closed on exact recovery request mismatch
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "$OPERATION_ID" || { echo "Recovery operation confirmation mismatch"; exit 1; }
          case "$ACTION" in
            verify_protected_state) ;;
            execute)
              test -n "$AUTHORIZATION_ID" || { echo "Missing recovery authorization_id"; exit 1; }
              echo "$PROTECTED_STATE_FINGERPRINT" | grep -Eq '^[a-f0-9]{64}$' || { echo "Invalid recovery protected_state_fingerprint"; exit 1; }
              echo "$AUTHORIZATION_REQUEST_HASH" | grep -Eq '^[a-f0-9]{64}$' || { echo "Invalid recovery authorization_request_hash"; exit 1; }
              ;;
            *) echo "Invalid recovery action"; exit 1 ;;
          esac

      - name: Acquire exact GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub OIDC request URL unavailable"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "GitHub OIDC request token unavailable"; exit 1; }
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${EXECUTION_URL}")"
          TOKEN="$(node -e 'const v=JSON.parse(process.argv[1]).value; if(!v) process.exit(1); process.stdout.write(v)' "$RESPONSE")"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Execute exact recovery action once
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(process.env.EXECUTION_URL, {
            method: "POST",
            headers: {
              "authorization": `Bearer ${process.env.OIDC_TOKEN}`,
              "content-type": "application/json"
            },
            body: JSON.stringify({
              operationId: process.env.OPERATION_ID,
              confirmation: process.env.CONFIRMATION,
              action: process.env.ACTION,
              authorizationId: process.env.AUTHORIZATION_ID || undefined,
              protectedStateFingerprint: process.env.PROTECTED_STATE_FINGERPRINT || undefined,
              authorizationRequestHash: process.env.AUTHORIZATION_REQUEST_HASH || undefined
            })
          });

          const text = await response.text();
          let payload;
          try { payload = text ? JSON.parse(text) : {}; }
          catch { payload = { raw: text }; }
          console.log(`HTTP ${response.status}`);
          console.log(JSON.stringify(payload, null, 2));

          if (process.env.ACTION === "verify_protected_state") {
            if (!response.ok || payload.status !== "PROTECTED_STATE_MATCH" || payload.ETSY_WRITE_COUNT !== 0) {
              throw new Error(`PDT_BPSC_C09_RECOVERY_PROTECTED_STATE_HTTP_${response.status}`);
            }
            process.exit(0);
          }
          if (response.status === 202 || payload.ETSY_WRITE_COUNT_STATUS === "UNRESOLVED_REQUIRES_RECONCILIATION") {
            throw new Error("PDT_BPSC_C09_RECOVERY_RECONCILIATION_REQUIRED_DO_NOT_RETRY");
          }
          if (!response.ok) throw new Error(`PDT_BPSC_C09_RECOVERY_HTTP_${response.status}`);
          if (!new Set(["PUBLISHED_AND_VERIFIED", "REPLAY"]).has(payload.status)) {
            throw new Error(`PDT_BPSC_C09_RECOVERY_NONTERMINAL_${payload.status ?? "UNKNOWN"}`);
          }
          NODE
