name: Execute Boba ZIP Upload Recovery 004

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Exact recovery operationId
        required: true
        type: string
      confirmation:
        description: Re-type exact operationId
        required: true
        type: string
      action:
        description: verify_protected_state or execute
        required: true
        default: verify_protected_state
        type: string
      authorization_id:
        description: Exact fresh authorization ID for execute
        required: false
        default: ""
        type: string
      authorization_request_hash:
        description: Exact fresh authorization request SHA-256 for execute
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: boba-zip-upload-recovery-004-${{ inputs.operation_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXECUTION_URL: https://autodigitalpublisher.vercel.app/api/internal/etsy/pdt-boba-001/b01/zip-upload-recovery-004
      OPERATION_ID: ${{ inputs.operation_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      ACTION: ${{ inputs.action }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
      AUTHORIZATION_REQUEST_HASH: ${{ inputs.authorization_request_hash }}
    steps:
      - name: Fail closed on request mismatch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATION_ID"
          test "$OPERATION_ID" = "$CONFIRMATION"
          case "$ACTION" in
            verify_protected_state) ;;
            execute)
              test -n "$AUTHORIZATION_ID"
              echo "$AUTHORIZATION_REQUEST_HASH" | grep -Eq '^[a-f0-9]{64}$'
              ;;
            *) echo "Invalid action"; exit 1 ;;
          esac

      - name: Acquire GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${EXECUTION_URL}")"
          TOKEN="$(node -e 'const v=JSON.parse(process.argv[1]).value; if(!v) process.exit(1); process.stdout.write(v)' "$RESPONSE")"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run exact recovery action once
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(process.env.EXECUTION_URL, {
            method: "POST",
            headers: {
              "authorization": `Bearer ${process.env.OIDC_TOKEN}`,
              "content-type": "application/json"
            },
            body: JSON.stringify({
              operationId: process.env.OPERATION_ID,
              confirmation: process.env.CONFIRMATION,
              action: process.env.ACTION,
              authorizationId: process.env.AUTHORIZATION_ID || undefined,
              authorizationRequestHash: process.env.AUTHORIZATION_REQUEST_HASH || undefined
            })
          });
          const text = await response.text();
          let payload; try { payload = text ? JSON.parse(text) : {}; } catch { payload = { raw: text }; }
          console.log(`HTTP ${response.status}`);
          console.log(JSON.stringify(payload, null, 2));
          if (process.env.ACTION === "verify_protected_state") {
            if (!response.ok || payload.status !== "PROTECTED_STATE_MATCH" || payload.ETSY_WRITE_COUNT !== 0) throw new Error(`PROTECTED_STATE_VERIFICATION_HTTP_${response.status}`);
            process.exit(0);
          }
          if (response.status === 202) throw new Error("RECONCILIATION_REQUIRED_DO_NOT_RETRY");
          if (!response.ok) throw new Error(`AUTHORIZED_ETSY_HTTP_${response.status}`);
          if (!new Set(["UPDATED_AND_VERIFIED","REPLAY"]).has(payload.status)) throw new Error(`AUTHORIZED_ETSY_NONTERMINAL_${payload.status ?? "UNKNOWN"}`);
          NODE
