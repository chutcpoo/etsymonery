name: Factory Login Security Tests

on:
  push:
    branches:
      - feature/factory-single-login-ui-20261124
  pull_request:
    branches:
      - feature/mosselorastudio-dna-runtime-v1-1

permissions:
  contents: read

jobs:
  login-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript checks
        run: npm run typecheck
      - name: Run offline application tests
        run: npm test
