name: CPR-003 Rotate Release Nonces R02

on:
  push:
    paths:
      - '.github/workflows/cpr003-rotate-release-nonces-r02.yml'

permissions:
  contents: write

jobs:
  rotate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rotate one-time nonce hashes
        shell: python
        run: |
          from pathlib import Path
          targets = {
              Path("app/api/internal/etsy/post-reset-v2/pdt-cpr-003/draft-create-r01/route.ts"): ("5cd95c6348dac30a7d8774ad1600f3fa2ddb6eedc1270935794175db7d8a7047", "640b024f72af9f2e383ee8a580b35dfe163b039957d162f44d0dd6f9b1e27635"),
              Path("app/api/internal/etsy/post-reset-v2/pdt-cpr-003/complete-r01/route.ts"): ("425a71d53798b681757e28cb30ea04e450bcbbc470f69d1d74180bd783b2dc57", "640b024f72af9f2e383ee8a580b35dfe163b039957d162f44d0dd6f9b1e27635"),
          }
          for path, (old, new) in targets.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one current nonce hash in {path}, found {count}")
              path.write_text(text.replace(old, new))
      - run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Commit verified nonce rotation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/internal/etsy/post-reset-v2/pdt-cpr-003/draft-create-r01/route.ts app/api/internal/etsy/post-reset-v2/pdt-cpr-003/complete-r01/route.ts
          git diff --cached --quiet && exit 1
          git commit -m "chore(product-03): rotate one-time release nonce R02 [GATE_CPR_RELEASE_R01]"
          git push origin HEAD:main
