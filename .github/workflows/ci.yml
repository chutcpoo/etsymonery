name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, restore-dashboard-20261121]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: node --require ./tests/offline.cjs --test .github/scripts/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_verify_p01_seller_zip.py' -v
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test authenticated application on loopback with fixture credentials
        run: node tests/operator-smoke.mjs
