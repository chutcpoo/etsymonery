name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Post-reset platform smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm start >/tmp/autodigitalpublisher.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done

          STATUS=$(curl -fsS http://127.0.0.1:3000/api/platform/status)
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="READY_FOR_NEW_PRODUCTS"||x.catalogState!=="ACTIVE_CATALOG"||x.liveCatalogCount!==4||x.registeredLiveListings!==4||x.legacyProductsLoaded!==0||x.legacyWritesEnabled!==false||x.ETSY_WRITE_COUNT!==0) process.exit(1)' "$STATUS"

          RESET=$(curl -fsS http://127.0.0.1:3000/api/internal/etsy/reset-status)
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="RESET_SAFE"||x.catalogState!=="EMPTY_CATALOG"||x.ETSY_WRITE_COUNT!==0) process.exit(1)' "$RESET"

          CODE=$(curl -sS -o /tmp/legacy.json -w '%{http_code}' http://127.0.0.1:3000/api/internal/etsy/authorized-operation)
          test "$CODE" = "410"

          VALID='{"productId":"NEW-PRODUCT-001","version":"V1","productName":"New Product","canonicalDriveFileId":"drive-file-new-001","buyerFiles":["buyer.xlsx"],"galleryFiles":["01.png"],"title":"New Product Spreadsheet","description":"A verified new product prepared after reset.","tags":["tag 1","tag 2","tag 3","tag 4","tag 5","tag 6","tag 7","tag 8","tag 9","tag 10","tag 11","tag 12","tag 13"],"priceUsd":9.99,"productTruthVerified":true,"testerPass":true,"finalQcPass":true}'
          PREP=$(curl -fsS -X POST http://127.0.0.1:3000/api/products/prepare -H 'content-type: application/json' --data "$VALID")
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="PREPARED"||x.listingId!==null||x.publishAuthorized!==false||x.EtsyWriteCount!==0||x.next!=="FRESH_PROTECTED_STATE_VERIFICATION") process.exit(1)' "$PREP"

          INVALID=$(node -e 'const x=JSON.parse(process.argv[1]); x.listingId=123456; process.stdout.write(JSON.stringify(x))' "$VALID")
          CODE=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/products/prepare -H 'content-type: application/json' --data "$INVALID")
          test "$CODE" = "422"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/invalid.json","utf8")); if(!x.errors?.includes("PREEXISTING_LISTING_ID_NOT_ALLOWED")||x.EtsyWriteCount!==0) process.exit(1)'
