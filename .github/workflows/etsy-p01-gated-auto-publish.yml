name: Etsy P01 gated auto-publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight is read-only. Publish needs separate protected environment approval."
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - publish
      confirmation:
        description: "For publish only: enter PUBLISH_P01_ONLY (does not replace reviewer approval)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: etsy-p01-release
  cancel-in-progress: false

jobs:
  preflight:
    name: P01 read-only Etsy release preflight
    if: inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    environment: etsy-p01-readonly
    timeout-minutes: 10
    env:
      P01_RELEASE_MODE: preflight
      P01_DRAFT_LISTING_ID: ${{ vars.P01_DRAFT_LISTING_ID }}
      P01_CANDIDATE_ID: ${{ vars.P01_CANDIDATE_ID }}
      P01_CANDIDATE_FINGERPRINT: ${{ vars.P01_CANDIDATE_FINGERPRINT }}
      P01_LISTING_FINGERPRINT: ${{ vars.P01_LISTING_FINGERPRINT }}
      ETSY_DRAFT_WRITE_TOKEN: ${{ secrets.ETSY_DRAFT_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9b33ea # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test exact P01 publisher
        run: node --test tests/etsy-p01-exact-release.test.mjs
      - name: Read-only Etsy preflight
        run: node scripts/etsy-p01-exact-release.mjs

  publish:
    name: Exact P01 publish, approval required
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    # GitHub Environment protection must be configured with required reviewer(s).
    environment: etsy-p01-publish
    timeout-minutes: 10
    env:
      P01_RELEASE_MODE: publish
      P01_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
      P01_PUBLISH_ENABLE: ${{ vars.P01_PUBLISH_ENABLE }}
      P01_DRAFT_LISTING_ID: ${{ vars.P01_DRAFT_LISTING_ID }}
      P01_CANDIDATE_ID: ${{ vars.P01_CANDIDATE_ID }}
      P01_CANDIDATE_FINGERPRINT: ${{ vars.P01_CANDIDATE_FINGERPRINT }}
      P01_LISTING_FINGERPRINT: ${{ vars.P01_LISTING_FINGERPRINT }}
      P01_APPROVED_ASSET_SET_SHA256: ${{ vars.P01_APPROVED_ASSET_SET_SHA256 }}
      ETSY_DRAFT_WRITE_TOKEN: ${{ secrets.ETSY_DRAFT_WRITE_TOKEN }}
      P01_RELEASE_AUTHORIZATION_JSON: ${{ secrets.P01_RELEASE_AUTHORIZATION_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9b33ea # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test exact P01 publisher
        run: node --test tests/etsy-p01-exact-release.test.mjs
      - name: Publish ONLY reviewed P01 listing
        run: node scripts/etsy-p01-exact-release.mjs
